name: Import Vivienda San Jeronimo assets

on:
  push:
    branches:
      - feature/vivienda-san-jeronimo-20261116
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download image package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/vivienda-san-jeronimo-assets.zip" \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_3JyDbghZNXmeLLpGsUpuxXQddfw/2d24a15b-a081-4194-bf33-be046bc6f18c.zip"

      - name: Extract and validate 20 WebP images
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/vivienda-san-jeronimo-assets.zip"
          UNPACK="$RUNNER_TEMP/vivienda-san-jeronimo-unpacked"
          ROOT="$UNPACK/vivienda-san-jeronimo-assets"
          DEST="public/images/projects/vivienda-san-jeronimo"

          unzip -q "$ARCHIVE" -d "$UNPACK"
          test -d "$ROOT/exteriores"
          test -d "$ROOT/interiores"
          test "$(find "$ROOT/exteriores" -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 7
          test "$(find "$ROOT/interiores" -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 13
          test "$(find "$ROOT" -type f -name '*.webp' | wc -l)" -eq 20

          mkdir -p "$DEST/exteriores" "$DEST/interiores"
          cp "$ROOT"/exteriores/*.webp "$DEST/exteriores/"
          cp "$ROOT"/interiores/*.webp "$DEST/interiores/"

          test "$(find "$DEST/exteriores" -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 7
          test "$(find "$DEST/interiores" -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 13

      - name: Commit assets to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/projects/vivienda-san-jeronimo/exteriores/*.webp
          git add public/images/projects/vivienda-san-jeronimo/interiores/*.webp
          if git diff --cached --quiet; then
            echo "The 20 image assets are already present."
            exit 0
          fi
          git commit -m "Add Vivienda San Jeronimo image assets"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:${BRANCH}"
