name: Import Cabo San Miguel architectural renders

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-cabo-san-miguel.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact user-provided renders ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 240 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JyDbghZNXmeLLpGsUpuxXQddfw/23577739-16b8-4c4f-8a2a-4c4947f77a09.zip' \
            -o /tmp/cabo-renders.zip
          echo '99212d128c5eec51599034fbe6a4e92c320200d6e6c1ed39abeb7bfd54cc687f  /tmp/cabo-renders.zip' | sha256sum --check
      - name: Optimize archive into local WebP files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/cabo-env
          /tmp/cabo-env/bin/pip install --quiet Pillow
          /tmp/cabo-env/bin/python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import zipfile, io
          archive='/tmp/cabo-renders.zip'
          dest=Path('public/images/projects/cabo-san-miguel')
          dest.mkdir(parents=True,exist_ok=True)
          written=[]
          with zipfile.ZipFile(archive) as z:
              for category, count in [('exteriores',10),('interiores',6)]:
                  for idx in range(1,count+1):
                      source=f'RENDERS/{category.upper()}/{idx}.png' if category=='exteriores' and idx==3 else f'RENDERS/{category.upper()}/{idx}.jpg'
                      with z.open(source) as image_file:
                          image=ImageOps.exif_transpose(Image.open(io.BytesIO(image_file.read()))).convert('RGB')
                      maxwidth=1920
                      if image.width>maxwidth:
                          image.thumbnail((maxwidth,2048),Image.Resampling.LANCZOS)
                      target=dest / f'{category}-{idx:02d}.webp'
                      image.save(target,'WEBP',quality=85,method=6)
                      written.append(target)
              for idx in range(1,4):
                  source=f'RENDERS/Modelo {idx}_Mesa de trabajo 1.png'
                  with z.open(source) as image_file:
                      image=ImageOps.exif_transpose(Image.open(io.BytesIO(image_file.read()))).convert('RGB')
                  image.thumbnail((2000,1500),Image.Resampling.LANCZOS)
                  target=dest / f'modelo-{idx:02d}.webp'
                  image.save(target,'WEBP',quality=85,method=6)
                  written.append(target)
          assert len(written)==19
          for file in written:
              with Image.open(file) as img: assert img.format=='WEBP'
              print(file, file.stat().st_size)
          PY
      - name: Commit gallery assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/projects/cabo-san-miguel
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import 19 verified Cabo San Miguel architectural images'
          git push
