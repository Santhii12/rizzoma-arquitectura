name: Import Juan Jose portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-studio-portrait.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download and authenticate provided portrait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/studio
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 12 --max-time 120 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JyDbghZNXmeLLpGsUpuxXQddfw/da1481a6-438b-4513-80a9-7a1dcdcca35e.png' \
            -o /tmp/juan-jose-portrait.png
          echo '8ce3191670d9bc1fa3e01d07bb712a09ead2b2c0237c6c3bce26d1e221c86a25  /tmp/juan-jose-portrait.png' | sha256sum --check
      - name: Optimize photo without changing composition
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/portrait-venv
          /tmp/portrait-venv/bin/pip install --quiet pillow
          /tmp/portrait-venv/bin/python - <<'PY'
          from PIL import Image
          image = Image.open('/tmp/juan-jose-portrait.png')
          assert image.size == (1122, 1402), 'Unexpected source dimensions'
          destination = 'public/images/studio/juan-jose-retrato-editorial.webp'
          image.convert('RGB').save(destination, 'WEBP', quality=89, method=6)
          with Image.open(destination) as result:
              assert result.size == (1122, 1402) and result.format == 'WEBP'
          PY
      - name: Save optimized image to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/studio/juan-jose-retrato-editorial.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add authentic high-resolution Juan Jose portrait to studio'
          git push
