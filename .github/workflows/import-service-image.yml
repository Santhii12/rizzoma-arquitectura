name: Import Rizzoma service photograph

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-service-image.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify approved photograph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/services
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 12 --max-time 90 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JyDbghZNXmeLLpGsUpuxXQddfw/b7ca6819-bad9-4e49-a964-cd42cb0e6fd3.jpg' \
            --output public/images/services/visualizacion-atardecer.jpg
          echo '473ba86c1241ebcfe94056922611b2153d4dbc3fb3e5033e92b556e2ed262366  public/images/services/visualizacion-atardecer.jpg' | sha256sum --check
          file public/images/services/visualizacion-atardecer.jpg
      - name: Commit photograph to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/services/visualizacion-atardecer.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add sunset image to Rizzoma services'
          git push
