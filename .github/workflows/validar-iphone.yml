name: Rizzoma · Validación móvil

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar-movil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Revisar Astro y TypeScript
        run: npm run check

      - name: Compilar versión GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Verificar imágenes, rutas y correcciones para iPhone
        run: |
          test -f dist/index.html
          test -f dist/portafolio/index.html
          test -f dist/servicios/index.html
          test -f dist/images/studio/home/rizzoma-hero-portada.webp
          grep -q "position: static" src/styles/que-podemos-hacer.css
          grep -q "aspect-ratio: 4 / 3" src/styles/que-podemos-hacer.css
          grep -q "font-variant-emoji: text" src/styles/home-selected-projects.css
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          for (const file of [
            'src/components/HomeSelectedProjects.astro',
            'src/components/QuePodemosHacer.astro',
            'src/pages/index.astro',
          ]) {
            const contents = readFileSync(file, 'utf8');
            assert.ok(contents.includes('↗︎'), 'Falta flecha tipográfica en ' + file);
          }
          console.log('Rutas, imagen principal y reglas de iPhone verificadas.');
          JS
